name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anchora
          POSTGRES_USER: anchora
          POSTGRES_PASSWORD: anchora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anchora -d anchora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # These exercise the Lua scripts and SQL, which the unit tests replace
      # with in-memory fakes.
      - name: Run integration tests
        env:
          ANCHORA_TEST_DATABASE_URL: postgres://anchora:anchora@localhost:5432/anchora?sslmode=disable
          ANCHORA_TEST_REDIS_URL: redis://localhost:6379/1
        run: go test -race -count=1 -run Integration ./internal/jobs/
