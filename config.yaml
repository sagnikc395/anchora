server:
  address: ":8080"

workflow:
  max_retries: 2
  retry_delay_ms: 500

async:
  # Turn this on to expose the job API; DATABASE_URL and REDIS_URL must then
  # point at PostgreSQL and Redis.
  enabled: false
  database_url_env: DATABASE_URL
  redis_url_env: REDIS_URL
  queue_name: anchora:jobs
  workers: 2

  # Visibility timeout. A claimed job is handed to another worker if its owner
  # stops heartbeating for this long, which is how a crashed node's work is
  # recovered. Raise it above your slowest expected job's step latency.
  lease_ms: 30000
  # Lease renewal interval. Must be well under lease_ms; 0 uses a third of it.
  heartbeat_ms: 0
  # Deliveries allowed before a job is dead-lettered. 0 means unlimited.
  max_attempts: 3
  # How often expired leases are swept and dead workers pruned.
  reaper_interval_ms: 5000
  # How long a silent worker stays in the registry. 0 uses four leases.
  worker_ttl_ms: 0
  # Jobs recovered per sweep.
  reclaim_batch: 100
  # Run the recovery sweep on this node. Safe to leave on everywhere; the
  # sweeps are atomic. Set false only if you run a dedicated reaper process.
  reaper: true

# Named agents point at the Python agent sidecar (agent/main.py), which serves
# a Qwen3 checkpoint — MLX on Apple Silicon, transformers elsewhere — and
# applies the instruction to the chat template. The sidecar listens on :8000;
# which model it serves is its own MODEL_NAME setting (docs/models.md), so the
# same agents work unchanged from Qwen3-0.6B up to Qwen3-32B.
#
# timeout_ms is per attempt and must cover a cold request to the model you
# serve: MAX_NEW_TOKENS divided by the model's decode rate, plus prefill. The
# 120 s below covers 256 tokens at the 8B–14B sizes on an M4; raise it for
# 32B or for larger MAX_NEW_TOKENS (docs/performance.md has the numbers).
agents:
  research:
    url: http://localhost:8000
    instruction: You are a concise research assistant.
    timeout_ms: 120000
  reviewer:
    url: http://localhost:8000
    instruction: You are a terse critic. Answer in one sentence, no preamble.
    timeout_ms: 120000
  summarizer:
    url: http://localhost:8000
    instruction: You compress text into a single sentence and nothing else.
    timeout_ms: 120000
  # Points at a port nothing listens on, so every call fails immediately. The
  # examples use it to exercise retries, failed steps, the skip cascade, and
  # dead-lettering without having to break the real sidecar.
  unreachable:
    url: http://127.0.0.1:9
    timeout_ms: 2000
