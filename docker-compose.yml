services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anchora
      POSTGRES_USER: anchora
      POSTGRES_PASSWORD: anchora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchora -d anchora"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
