services:
  # Started only with `docker compose --profile app up`, so the Taskfile's
  # services-up still brings up nothing but the dependencies the integration
  # tests need. config.yaml is mounted rather than baked in, so async can be
  # enabled without rebuilding the image.
  anchora:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://anchora:anchora@postgres:5432/anchora?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The Python agent sidecar (agent/main.py): a Qwen checkpoint served over
  # POST /run. Anchora's agent entries point at it — http://agent:8000 from
  # the anchora container, http://localhost:8000 from the host (port mapped).
  # The model cache volume keeps the weight download on restarts.
  #
  # Inside a Linux container the sidecar runs the transformers backend on the
  # CPU, or on a GPU if the host passes one through (uncomment `deploy`). It
  # cannot reach Apple Silicon's GPU from a container, so on a Mac run the
  # sidecar natively instead (`task agent-run`), where MLX serves the larger
  # models. See docs/performance.md.
  agent:
    profiles: ["app"]
    build: ./agent
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen3-0.6B}
      BACKEND: transformers
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-256}
      BATCH_SIZE: ${BATCH_SIZE:-16}
      BATCH_WINDOW_MS: "10"
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-8}
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - agent-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anchora
      POSTGRES_USER: anchora
      POSTGRES_PASSWORD: anchora
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchora -d anchora"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    # The queue's lease bookkeeping is only as durable as Redis. Append-only
    # persistence with per-second fsync means a restart loses at most a second
    # of dispatch state, and the store-side reaper recovers anything beyond it.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Observability stack, started only with `--profile telemetry`. Prometheus
  # scrapes an Anchora running on the host (host.docker.internal); Promtail
  # tails ./logs, where the host-run binary writes. `task telemetry-up`.
  prometheus:
    profiles: ["telemetry"]
    image: prom/prometheus:v3.8.0
    command:
      - --config.file=/etc/prometheus/config.yml
    ports:
      - "9090:9090"
    volumes:
      - ./telemetry/prometheus/prometheus.yml:/etc/prometheus/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["telemetry"]
    image: grafana/grafana:12.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro

  loki:
    profiles: ["telemetry"]
    image: grafana/loki:3.4.0
    command:
      - -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./telemetry/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  promtail:
    profiles: ["telemetry"]
    image: grafana/promtail:3.4.0
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./logs:/var/log/anchora:ro
      - ./telemetry/promtail/promtail.yml:/etc/promtail/config.yml:ro

volumes:
  postgres-data:
  redis-data:
  agent-cache:
