# Promtail tails the host-run binary's log file, which the compose file
# bind-mounts from ./logs.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: anchora
    static_configs:
      - targets: [localhost]
        labels:
          job: anchora
          __path__: /var/log/anchora/*.log
